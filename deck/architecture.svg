<svg class="aa" viewBox="0 0 1200 580" role="img" aria-label="AWS architecture of the booth lead agent. 1, make run on the presenter laptop starts a Step Functions execution per lead. 2, Step Functions invokes the AppFunction Lambda for each step. 3, Lambda reads the contact and the do-not-contact flag from the DynamoDB CRM table. 4, Lambda reads the Jev key and the Anthropic key from Parameter Store. 5, Lambda asks TypeSafe Jev what the lead wants. 6, a Strands agent writes the draft with Claude on the Anthropic API by default, or Amazon Bedrock Nova when MODEL_PROVIDER is bedrock. Its tools read the CRM table. 7, Lambda asks Jev if the draft promises anything. 8a, if sure, Amazon SES sends the follow-up to the SES mailbox simulator with a blind copy to the AE. 8b, if not sure, Step Functions waits on a task token and SES emails the AE an approval link. 9, the AE clicks the link, the ApproveFunction URL reads the token from the runs table and calls SendTaskSuccess, and the flow resumes at 8a. Every step writes a receipt to the DynamoDB runs table, which make reroute reads." xmlns="http://www.w3.org/2000/svg" width="1200" height="580"><title>Booth lead architecture on AWS</title><style>
text { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }

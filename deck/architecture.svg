OCK</text><text class="aa-rs" x="820" y="193">Nova Lite</text><g transform="translate(938 46)"><rect class="aa-nt" width="48" height="48" rx="10"/><g class="aa-gl"><circle cx="12" cy="24" r="3"/><path d="M15 24h6l8-8h7M21 24l8 8h7"/></g></g><text class="aa-sn aa-l" x="996" y="67">TYPESAFE JEV</text><text class="aa-rs aa-l" x="996" y="81">api.typesafe.ai</text><g transform="translate(938 226)"><rect class="aa-nt" width="48" height="48" rx="10"/><g class="aa-gl"><path d="M11 13h26v17H21l-6 5v-5h-4z"/><path d="M16 19h16M16 24h10"/></g></g><text class="aa-sn aa-l" x="996" y="247">ANTHROPIC API</text><text class="aa-rs aa-l" x="996" y="261">Claude, the default</text><g transform="translate(938 372)"><rect class="aa-nt" width="48" height="48" rx="10"/><g class="aa-gl"><path d="M11 27l4-11h18l4 11v8H11z"/><path d="M11 27h8l2 3h6l2-3h8"/></g></g><text class="aa-sn aa-l" x="996" y="393">CUSTOMER</text><text class="aa-rs aa-l" x="996" y="407">SES mailbox simulator</text><g transform="translate(938 456)"><rect class="aa-nt" width="48" height="48" rx="10"/><g class="aa-gl"><circle cx="24" cy="18" r="5.5"/><path d="M13 36c0-6 5-9.5 11-9.5S35 30 35 36"/></g></g><text class="aa-sn aa-l" x="996" y="477">AE INBOX</text><text class="aa-rs aa-l" x="996" y="491">BCC copies, approvals</text><rect class="aa-pill" x="208" y="194" width="134" height="21" rx="10.5"/><g class="aa-badge"><circle cx="219" cy="204.5" r="10"/><text class="aa-sm" x="219" y="208.1">8b</text></g><text class="aa-rs aa-l" x="234" y="208">waitForTaskToken</text><text class="aa-al aa-mid" x="360" y="249">invoke per step</text><text class="aa-al" x="516" y="186">agent tools</text><text class="aa-al" x="516" y="210">do-not-contact</text><text class="aa-al" x="644" y="160">promises anything?</text><text class="aa-al" x="644" y="190">what do they want?</text><text class="aa-rs aa-end" x="810" y="225">MODEL_PROVIDER=bedrock</text><text class="aa-al" x="734" y="268">agent writes the draft</text><text class="aa-al" x="834" y="244">default</text><text class="aa-al" x="686" y="310">sure: send it</text><text class="aa-al" x="686" y="342">not sure: ask the AE</text><text class="aa-al" x="510" y="339">receipt every step</text><text class="aa-al" x="510" y="353">+ task token (8b)</text><text class="aa-al" x="786" y="389">follow-up</text><text class="aa-al aa-end" x="848" y="432">BCC + approval link</text><text class="aa-al" x="616" y="486">AE clicks the link (Function URL)</text><text class="aa-al" x="291" y="342">SendTaskSuccess</text><text class="aa-al" x="291" y="356">resumes at 8a</text><text class="aa-al aa-mid" x="388" y="390">reads token</text><g class="aa-badge"><circle cx="222" cy="244" r="10"/><text x="222" y="247.6">1</text></g><g class="aa-badge"><circle cx="440" cy="256" r="10"/><text x="440" y="259.6">2</text></g><g class="aa-badge"><circle cx="500" cy="206" r="10"/><text x="500" y="209.6">3</text></g><g class="aa-badge"><circle cx="410" cy="170" r="10"/><text x="410" y="173.6">4</text></g><g class="aa-badge"><circle cx="630" cy="186" r="10"/><text x="630" y="189.6">5</text></g><g class="aa-badge"><circle cx="720" cy="250" r="10"/><text x="720" y="253.6">6</text></g><g class="aa-badge"><circle cx="630" cy="156" r="10"/><text x="630" y="159.6">7</text></g><g class="aa-badge"><circle cx="670" cy="306" r="10"/><text class="aa-sm" x="670" y="309.6">8a</text></g><g class="aa-badge"><circle cx="770" cy="396" r="10"/><text class="aa-sm" x="770" y="399.6">8a</text></g><g class="aa-badge"><circle cx="670" cy="338" r="10"/><text class="aa-sm" x="670" y="341.6">8b</text></g><g class="aa-badge"><circle cx="860" cy="446" r="10"/><text class="aa-sm" x="860" y="449.6">8b</text></g><g class="aa-badge"><circle cx="600" cy="494" r="10"/><text x="600" y="497.6">9</text></g><g class="aa-badge"><circle cx="275" cy="346" r="10"/><text x="275" y="349.6">9</text></g><g class="aa-badge"><circle cx="500" cy="182" r="10"/><text x="500" y="185.6">6</text></g><g transform="translate(20 552)"><rect x="0" y="
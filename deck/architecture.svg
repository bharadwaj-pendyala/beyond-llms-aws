.aa-al { fill: #c3c2b7; font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; }
.aa-l { text-anchor: start; }
.aa-end { text-anchor: end; }
.aa-mid { text-anchor: middle; }
.aa-nt { fill: #232322; stroke: rgba(255,255,255,0.10); }
